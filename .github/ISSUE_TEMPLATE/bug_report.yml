name: Bug report
description: Something in AppHQ doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Accounts → TikTok
        2. Click Connect
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running AppHQ?
      options:
        - Cloudways Velocity
        - Another host
        - Locally
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any tokens, keys, passwords or email addresses first.
