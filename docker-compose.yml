# Local development only. Production uses the PostgreSQL attached to the `api` application on
# Cloudways Velocity, and a real mail provider.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: appdashboard
      POSTGRES_PASSWORD: appdashboard
      POSTGRES_DB: appdashboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdashboard -d appdashboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: catches the emails of email sign-up instead of delivering them, and shows them at
  # http://127.0.0.1:8025. Start it with `docker compose --profile mail up -d`; see "Signing up
  # with an email address" in the README for the variables that point the API at it.
  mail:
    image: axllent/mailpit
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
